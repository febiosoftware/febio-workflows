    required: true
    type: string
  repo-dir:
    default: .
    required: false
    type: string
  package-name:
    required: true
    type: string
  package-sdk:
    default: false
    required: false
    type: boolean
  requires-sdk:
    default: false
    required: false
    type: boolean
  script:
    required: true
    type: string
  post-build:
    required: false
    type: boolean
    default: false
  python-module:
    required: false
    type: boolean
    default: false
  os:
    required: true
    type: string
  arch:
    required: true
    type: string
  macos_pkcs12_pswd:
    required: true
    type: string
  macos_keychain:
    required: true
    type: string
  macos_keychain_password:
    required: true
    type: string
  macos_sign:
    required: true
    type: string
outputs:
  febio-version:
    value: ${{ steps.get-sdk.outputs.febio-version }}

