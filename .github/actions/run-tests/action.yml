name: 'Run tests'
description: 'Creates SDK and Uploads artifacts'
inputs:
  shell:
    required: false
    default: bash
    type: string
  package-name:
    required: true
    type: string
  os:
    required: true
    type: string
  arch:
    required: true
    type: string
  script:
    required: true
    type: string
  git-user-email:
    required: false
    default: workflow@febio.org
    type: string
  git-user-name:
    required: false
    default: FEBio Workflow
    type: string
  git-token:
    required: true
    type: string
runs:
  using: "composite"
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{inputs.package-name}}-${{inputs.os}}-${{inputs.arch}}
        path: |
          cmbuild
    - uses: actions/download-artifact@v4
      with:
        name: plugins-${{inputs.os}}-${{inputs.arch}}
        path: |
          plugins
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: 'master'
        path: ./TestSuite
        repository: febiosoftware/TestSuite
        token: ${{inputs.git-token}}
    - name: Run test suite
      shell: ${{inputs.shell}}
      run: |
        git config user.email "${{ inputs.git-user-email }}"
        git config user.name "${{ inputs.git-user-name }}"
        ${{ inputs.script }}
    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: testsuite-${{inputs.os}}-${{inputs.arch}}-logs
        path: |
          TestSuite/Verify/*.log
          TestSuite/Logs/*.txt
