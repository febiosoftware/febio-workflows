on:
  workflow_call:
    inputs:
      shell:
        required: false
        default: bash
        type: string
      aws-region:
        default: us-east-1
        required: false
        type: string
      os:
        default: Windows
        required: false
        type: string
      arch:
        default: X64
        required: false
        type: string
      runTests:
        description: "Run tests?"
        required: false
        type: boolean
        default: false
      aws-subnet-id:
        required: false
        default: subnet-064f21b53fc72cf44
        type: string
      aws-sg-id:
        required: false
        default: sg-0ca7912782cf1538b
        type: string
      aws-ami-id:
        required: false
        default: ami-0b18c665dbe9efa75
        type: string
      aws-instance-type:
        required: false
        default: c5a.8xlarge
        type: string
      aws-availability-zone:
        required: false
        default: us-east-1b
        type: string
      aws-role-to-assume:
        required: false
        default: arn:aws:iam::353328028284:role/github-actions-runner
        type: string
      aws-role-session-name:
        required: false
        default: febio-github-actions-runner-session
        type: string
      key-pair:
        required: false
        default: win
        type: string

jobs:
  start-runner:
    name: Start self-hosted EC2 runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          role-session-name: ${{ inputs.aws-role-session-name }}
          aws-region: ${{ inputs.aws-region }}
      - id: gh-token # Fetch github-token from aws-ssm
        name: Git Describe
        uses: febiosoftware/febio-workflows/.github/actions/github-token@develop
        with:
          shell: ${{ inputs.shell }}
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: febiosoftware/ec2-multiple-github-runners@multi-os-multi-runner
        with:
          mode: start
          key-pair: ${{ inputs.key-pair }}
          os: ${{ inputs.os }}
          github-token: ${{ steps.gh-token.outputs.token}}
          ec2-image-id: ${{ inputs.aws-ami-id}}
          ec2-instance-type: ${{ inputs.aws-instance-type }}
          subnet-id: ${{ inputs.aws-subnet-id }}
          security-group-id: ${{ inputs.aws-sg-id }}
          availability-zone: ${{ inputs.aws-availability-zone }}
          wait-for-registry-timeout: 7
          aws-resource-tags: > # optional, requires additional permissions
            [
              {"Key": "Name", "Value": "ec2-github-runner"},
              {"Key": "GitHubRepository", "Value": "${{ github.repository }}"},
              {"Key": "os", "Value": "${{ inputs.os }}"}
            ]
  release:
    name: Run release script
    needs:
      - start-runner # required to get output from the start-runner job
    runs-on: ${{ needs.start-runner.outputs.label }} # run the job on the newly created runner
    outputs:
      febio_git_describe: ${{ steps.describe_febio.outputs.git_describe_stripped }}
      fbs_git_describe: ${{ steps.describe_fbs.outputs.git_describe_stripped }}
    steps:
      - name: Checkout FBS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: FEBioStudio
          ref: master
      - name: Checkout FEBio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: FEBio
          repository: febiosoftware/FEBio
          ref: master
      - name: Checkout FEBioChem
        uses: actions/checkout@v4
        with:
          path: FEBioChem
          repository: febiosoftware/FEBioChem
          ref: master
      - name: Checkout FEBioHeat
        uses: actions/checkout@v4
        with:
          path: FEBioHeat
          repository: febiosoftware/FEBioHeat
          ref: master
      - name: Describe FEBio
        uses: febioSoftware/febio-workflows/.github/actions/git-describe@develop
        id: describe_febio
        with:
          shell: bash
          path: FEBio
      - name: Describe FBS
        uses: febioSoftware/febio-workflows/.github/actions/git-describe@develop
        id: describe_fbs
        with:
          shell: bash
          path: FEBioStudio
      - name: Release
        uses: febiosoftware/febio-workflows/.github/actions/release@develop
        with:
          febioVer: ${{ steps.describe_febio.outputs.git_describe_stripped }}
          fbsVer: ${{ steps.describe_fbs.outputs.git_describe_stripped }}
          shell: powershell
          script: FEBioStudio/ci/${{inputs.os}}/release.ps1
          os: ${{inputs.os}}
          ib_license_contents: ${{ secrets.INSTALL_BUILDER_LICENSE }}
  stop-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-runner # required to get output from the start-runner job
      - release # required to wait when the main job is done
    runs-on: ubuntu-latest
    if: ${{ always() }} # required to stop the runner even if the error happened in the previous jobs
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          role-session-name: ${{ inputs.aws-role-session-name }}
          aws-region: ${{ inputs.aws-region }}
      - id: gh-token # Fetch github-token from aws-ssm
        name: Git Describe
        uses: febiosoftware/febio-workflows/.github/actions/github-token@develop
        with:
          shell: ${{ inputs.shell }}
      - name: Stop EC2 runner
        uses: febiosoftware/ec2-multiple-github-runners@multi-os-multi-runner
        with:
          mode: stop
          os: ${{ inputs.os }}
          wait-for-deregistry-timeout: 5
          github-token: ${{ steps.gh-token.outputs.token}}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
  repo-artifacts:
    name: Upload artifacts to repo
    needs:
      - release # required to get output from the start-runner job
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Repo Artifacts
        uses: febiosoftware/febio-workflows/.github/actions/repo-artifacts-release@develop
        with:
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-host: ${{ secrets.SSH_HOST }}
          os: ${{inputs.os}}
          febioVer: ${{ needs.release.outputs.febio_git_describe }}
          fbsVer: ${{ needs.release.outputs.fbs_git_describe }}
